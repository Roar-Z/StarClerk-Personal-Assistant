<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>卸载 StarClerk</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="head">
        <div class="brand">
          <div class="logo">S</div>
          <div class="brand-text">
            <h1>卸载 StarClerk</h1>
            <p>本地桌面版 · 数据清理向导</p>
          </div>
        </div>
        <span class="ver">v0.2.0</span>
      </header>

      <main class="body">
        <section class="panel facts-panel">
          <div class="facts">
            <div class="fact">
              <span>安装位置</span>
              <b id="where" title="">—</b>
            </div>
            <div class="fact">
              <span>可清理数据</span>
              <b id="total">—</b>
            </div>
            <div class="fact">
              <span>运行状态</span>
              <b id="run">检测中…</b>
            </div>
          </div>
          <button class="mini" id="kill" hidden>结束进程</button>
        </section>

        <div class="banner" id="banner" hidden>
          <strong id="banner-title">注意</strong>
          <span id="banner-text"></span>
        </div>

        <section class="panel list" id="list">
          <div class="loading">正在读取本机数据…</div>
        </section>

        <p class="tip">
          勾选的内容只在本机删除，不会上传到任何地方。模型配置和授权信息删掉后需要重新填写。
        </p>
      </main>

      <footer class="foot">
        <button class="link" id="all">删除所有数据</button>
        <div class="right">
          <button class="ghost" id="cancel">关闭</button>
          <button class="primary danger" id="go" disabled>卸载所选内容</button>
        </div>
      </footer>
    </div>

    <div class="mask" id="mask" hidden>
      <div class="dialog" role="dialog" aria-modal="true">
        <h2 id="dlg-title">确认删除</h2>
        <p class="dlg-sub" id="dlg-sub">下面这些内容会被永久删除，本机没有备份。</p>
        <ul class="dlg-list" id="dlg-list"></ul>
        <div class="dlg-warn" id="dlg-warn" hidden></div>
        <div id="dlg-input">
          <label class="dlg-label" for="phrase">请输入 <b>DELETE</b> 确认删除</label>
          <input id="phrase" autocomplete="off" spellcheck="false" placeholder="DELETE" />
        </div>
        <div class="dlg-foot">
          <button class="ghost" id="back">取消</button>
          <button class="primary danger" id="confirm" disabled>确认删除</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
