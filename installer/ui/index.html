<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>安装 StarClerk</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="install.css" />
  </head>
  <body>
    <div class="app">
      <header class="title-bar">
        <div class="title-left">
          <span class="app-icon">S</span>
          <h1>StarClerk 安装程序</h1>
        </div>
        <span class="ver" id="ver">版本 —</span>
      </header>

      <div class="main">
        <aside class="side">
          <div class="step on" data-s="1"><span class="num">1</span>欢迎</div>
          <div class="step" data-s="2"><span class="num">2</span>安装位置</div>
          <div class="step" data-s="3"><span class="num">3</span>附加任务</div>
          <div class="step" data-s="4"><span class="num">4</span>安装</div>
        </aside>

        <main class="body">
          <!-- 1 欢迎 -->
          <section class="page" id="page1">
            <div class="page-head">
              <h2>欢迎使用 StarClerk 安装程序</h2>
              <p>安装程序将引导您完成 StarClerk 的安装。安装在当前用户下进行，不需要管理员权限。</p>
            </div>
            <div class="panel sum-box" id="welcome"></div>
            <p class="tip" id="welcome-tip">点击「下一步」继续；如需退出安装，请点击左下角的「取消安装」。</p>
          </section>

          <!-- 2 目录 -->
          <section class="page" id="page2" hidden>
            <div class="page-head">
              <h2>选择安装位置</h2>
              <p>安装程序将把程序文件安装到下面的文件夹。如需更改，请点击「浏览」选择其他位置。</p>
            </div>
            <div class="field">
              <span>安装文件夹</span>
              <div class="path-row">
                <input id="dir" autocomplete="off" spellcheck="false" />
                <button class="ghost" id="browse">浏览</button>
              </div>
              <p class="hint" id="dir-hint">建议选择空间充足的磁盘，路径不要包含特殊字符。</p>
            </div>
            <div class="panel sum-box" id="space"></div>
          </section>

          <!-- 3 附加任务 -->
          <section class="page" id="page3" hidden>
            <div class="page-head">
              <h2>附加任务</h2>
              <p>请选择安装程序需要执行的附加任务，安装完成后也可以在设置中修改。</p>
            </div>
            <div class="panel">
              <label class="opt">
                <input type="checkbox" id="desktop" checked />
                <div>
                  <b>创建桌面快捷方式</b>
                  <span>在桌面生成 StarClerk 快捷方式</span>
                </div>
              </label>
              <label class="opt">
                <input type="checkbox" id="menu" checked />
                <div>
                  <b>添加到开始菜单</b>
                  <span>在开始菜单中创建 StarClerk 快捷方式</span>
                </div>
              </label>
              <label class="opt">
                <input type="checkbox" id="autostart" />
                <div>
                  <b>开机自动启动</b>
                  <span>登录 Windows 后自动启动，驻留系统托盘</span>
                </div>
              </label>
            </div>
          </section>

          <!-- 4 安装 + 完成 -->
          <section class="page" id="page4" hidden>
            <div class="done-mark" id="done-mark">↓</div>
            <div class="page-head">
              <h2 id="last-title">正在安装</h2>
              <p id="last-sub">正在复制程序文件，请勿关闭窗口。</p>
            </div>
            <div class="progress"><i id="bar"></i></div>
            <ul class="step-log" id="log"></ul>
            <div class="panel sum-box" id="done-box" hidden></div>
          </section>
        </main>
      </div>

      <footer class="foot">
        <div class="left">
          <button class="link" id="quit">取消安装</button>
        </div>
        <div class="right">
          <button class="ghost" id="prev" hidden>上一步</button>
          <button class="primary" id="next">下一步</button>
          <button class="primary" id="install" hidden>安装</button>
          <button class="primary" id="finish" hidden>完成</button>
        </div>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
